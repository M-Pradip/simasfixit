services:
  postgres:
    image: postgres:16-alpine
    container_name: simasfixitapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: asfixitvendor
      POSTGRES_USER: postgresVendor
      POSTGRES_PASSWORD: postgresVendor
    ports:
      - "5433:5432"
    volumes:
      - simasfixitapp-postgres:/var/lib/postgresql/data

volumes:
  simasfixitapp-postgres:
